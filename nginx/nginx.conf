# ─── Nginx Production Konfigürasyonu ─────────────────────────────────────────
# Sigorta Hasar Sistemi — Reverse Proxy + SSL + Security Headers
#
# DİKKAT: DOMAIN değişkeni deploy.sh tarafından otomatik doldurulur.
#          Elle düzenlemek isterseniz "app.meridyen-tr.com" yerine alan adınızı yazın.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Log Formatı ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ─── Performans ─────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ─── Gzip Sıkıştırma ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Güvenlik: IP Kısıtlama ─────────────────────────────────────────────
    # Brute-force saldırılarını yavaşlatır
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_status 429;

    # ─── HTTP → HTTPS Yönlendirme ────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name app.meridyen-tr.com www.app.meridyen-tr.com;

        # Let's Encrypt doğrulama için
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Docker healthcheck HTTP üzerinden gelir; HTTPS redirect'e düşmemelidir.
        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Diğer tüm istekleri HTTPS'e yönlendir
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Ana Sunucu ────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.meridyen-tr.com www.app.meridyen-tr.com;

        # ─── SSL Sertifika ──────────────────────────────────────────────────
        ssl_certificate /etc/letsencrypt/live/app.meridyen-tr.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.meridyen-tr.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/app.meridyen-tr.com/chain.pem;

        # ─── SSL Güvenlik Ayarları ──────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ─── Güvenlik Başlıkları ────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;

        # ─── Health Check (Nginx kendi health check için) ────────────────────
        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
            access_log off;
        }

        # ─── API (Backend → NestJS) ──────────────────────────────────────────
        location /api {
            # Rate limiting — uygulama içi sayfa geçişlerinde çoklu API çağrıları 503 üretmemeli.
            # Login brute-force koruması ayrı auth_limit bloğunda korunur.
            limit_req zone=api_limit burst=200 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeout ayarları (büyük dosya yüklemeleri için)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── Auth Endpoint (Ekstra Rate Limiting) ────────────────────────────
        # login, şifre sıfırlama, token yenileme — brute-force koruması
        location ~ ^/api/v1/auth/(login|forgot-password|reset-password|refresh)$ {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public ödeme linkleri — enumeration / checkout spam
        location ~ ^/api/v1/public/collection-links/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook callback'leri (PayTR, Graph vb.)
        location ~ ^/api/v1/webhooks/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/operation-inbox/webhooks/ {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── WebSocket (Socket.IO) ───────────────────────────────────────────
        location /socket.io {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # ─── Next.js Static Dosyalar (Agresif Cache) ────────────────────────
        location /_next/static/ {
            proxy_pass http://web:3001;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ─── Public Dosyalar ─────────────────────────────────────────────────
        location /favicon.ico {
            proxy_pass http://web:3001;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ─── Backend Statik Yüklemeler (rapor fotoğrafları vb.) ───────────────
        location /uploads/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ─── Frontend (Next.js) ──────────────────────────────────────────────
        location / {
            proxy_pass http://web:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
