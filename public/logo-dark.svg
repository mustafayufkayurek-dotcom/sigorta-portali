<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" role="img" aria-label="Meridyen Assistance - Dark">
  <defs>
    <linearGradient id="shieldGradD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A5BAA"/>
      <stop offset="100%" stop-color="#1A3870"/>
    </linearGradient>
    <linearGradient id="goldGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD060"/>
      <stop offset="100%" stop-color="#E8950A"/>
    </linearGradient>
    <filter id="shieldShadowD" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Shield body — lighter for dark bg -->
  <path
    d="M36 6 L10 16 L10 38 C10 52 22 63 36 67 C50 63 62 52 62 38 L62 16 Z"
    fill="url(#shieldGradD)"
    filter="url(#shieldShadowD)"
  />

  <!-- Shield rim highlight -->
  <path
    d="M36 6 L62 16 L58 18 L36 9.5 L14 18 L10 16 Z"
    fill="url(#goldGradD)"
  />

  <!-- Inner shield glow edge -->
  <path
    d="M36 10 L14 19 L14 38 C14 50 24.5 60 36 63.5 C47.5 60 58 50 58 38 L58 19 Z"
    fill="none"
    stroke="#4A80D0"
    stroke-width="0.7"
    opacity="0.5"
  />

  <!-- M letterform white on dark shield -->
  <line x1="21" y1="23" x2="21" y2="46" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="51" y1="23" x2="51" y2="46" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="21" y1="23" x2="36" y2="34" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="51" y1="23" x2="36" y2="34" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold stair steps left -->
  <line x1="21" y1="29" x2="28" y2="29" stroke="url(#goldGradD)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="21" y1="35" x2="28" y2="35" stroke="url(#goldGradD)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="21" y1="41" x2="28" y2="41" stroke="url(#goldGradD)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Gold stair steps right -->
  <line x1="44" y1="29" x2="51" y2="29" stroke="url(#goldGradD)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="44" y1="35" x2="51" y2="35" stroke="url(#goldGradD)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="44" y1="41" x2="51" y2="41" stroke="url(#goldGradD)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Center peak dot -->
  <circle cx="36" cy="34" r="2.2" fill="url(#goldGradD)"/>

  <!-- MERIDYEN text — white on dark -->
  <text
    x="78"
    y="36"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="3"
    fill="#FFFFFF"
  >MERIDYEN</text>

  <!-- Gold underline -->
  <rect x="78" y="40" width="168" height="2" rx="1" fill="url(#goldGradD)"/>

  <!-- ASSISTANCE text — muted light blue -->
  <text
    x="78"
    y="56"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="500"
    letter-spacing="5"
    fill="#8AACDB"
  >ASSISTANCE</text>
</svg>
