<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Eksper Portalı — Referans vs Mevcut</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; gap: 16px; align-items: center; }
    h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; height: calc(100vh - 48px); }
    .col { display: flex; flex-direction: column; min-height: 0; background: #1e293b; border-radius: 8px; overflow: hidden; }
    .col h2 { margin: 0; padding: 8px 12px; font-size: 12px; background: #334155; letter-spacing: 0.02em; }
    .col.ref h2 { background: #065f46; }
    .col.cur h2 { background: #9a3412; }
    .col img { width: 100%; height: 100%; object-fit: contain; background: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>Piksel karşılaştırma — sol: ONAYLI REFERANS · sağ: MEVCUT LOCAL</h1>
  </header>
  <div class="grid">
    <div class="col ref">
      <h2>REFERANS — EKSPER_PORTALI_FINAL.jpeg</h2>
      <img src="../docs/project-governance/ui-reference/EKSPER_PORTALI_FINAL.jpeg" alt="Referans" />
    </div>
    <div class="col cur">
      <h2>MEVCUT — desktop-1440-full.png (kabul edilmeyen sürüm)</h2>
      <img src="../docs/project-governance/canli-kabul/ekran-goruntuleri/eksper-portal-final-20260723/desktop-1440-full.png" alt="Mevcut" />
    </div>
  </div>
</body>
</html>
